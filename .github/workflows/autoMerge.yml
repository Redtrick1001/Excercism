name: Auto Merge Specific User PRs

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only run if the PR author matches the target username and is not a draft
    if: github.actor == 'exercism-solutions-syncer[bot]' && github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable Auto-Merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
